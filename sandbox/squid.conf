# 재현 샌드박스 벤더 API 프록시 설정.
# CONNECT(TLS 터널)는 도메인:443 만 허용. 그 외 모든 아웃바운드 차단.
# 본문은 종단간 TLS 라 프록시도 못 읽는다(메타만 필터).

acl repro_vendors dstdomain api.openai.com api.anthropic.com generativelanguage.googleapis.com
acl SSL_ports port 443
acl CONNECT method CONNECT

# 443 외 CONNECT 거부, 허용 도메인만 터널 허용
http_access deny CONNECT !SSL_ports
http_access allow CONNECT repro_vendors
http_access allow repro_vendors
http_access deny all

http_port 3128

# 익명성·군더더기 제거
forwarded_for delete
via off
request_header_access X-Forwarded-For deny all

# 캐시 없음(요청 본문이 디스크에 남지 않게)
cache deny all
access_log none
